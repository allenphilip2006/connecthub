# Active profile: local uses application-local.properties (gitignored)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database — override via env or application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/connecthub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ConnectHubHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.use_second_level_cache=false
spring.jpa.properties.hibernate.query.startup_check=false

# Tomcat
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=25
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000

# Async Task Executor
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=32
spring.task.execution.pool.queue-capacity=200
spring.task.execution.thread-name-prefix=async-task-

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2MB

# Static / uploads — override in application-local.properties for your machine
spring.web.resources.static-locations=${STATIC_LOCATIONS:classpath:/static/,file:./uploads/}
spring.web.resources.cache.period=86400
connecthub.chat.upload-dir=${CHAT_UPLOAD_DIR:./uploads/chat/}

server.servlet.context-path=/
server.port=${SERVER_PORT:62223}

# Logging
logging.level.root=WARN
logging.level.com.connecthub.connecthub=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
